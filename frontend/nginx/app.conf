# Rutas comunes a HTTP y HTTPS (incluido desde default.conf y https.conf). Solo en producción.

# Fotos del escáner (las del móvil pesan varios MB).
client_max_body_size 15m;

# DNS de Docker + variable: "backend" se resuelve en cada petición. Con un
# upstream fijo, Nginx guarda la IP del arranque y da 502 cuando el
# contenedor del backend se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8000;

root /usr/share/nginx/html;
index index.html;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;

# Páginas propias: archivo que no existe (fotos, recursos) y backend caído o reiniciándose.
error_page 404 /404.html;
error_page 502 503 504 /50x.html;
location = /404.html { internal; }
location = /50x.html { internal; add_header Cache-Control "no-store"; }

# API: con el backend caído responde JSON (la web lo muestra como un error más).
location /api/ {
    proxy_pass $backend;
    error_page 502 503 504 = @api_down;
}
location @api_down {
    default_type application/json;
    return 503 '{"detail": "El servidor no responde en este momento. Vuelve a intentarlo en un minuto.", "status": 503}';
}

location ~ ^/(admin|static)/ {
    proxy_pass $backend;
}

# Fotos de los escaneos e imágenes propias de impresiones (volumen media, solo lectura).
location /media/ {
    alias /srv/media/;
    expires 7d;
}

# Certificado (público) de la CA local, para instalarlo en el móvil o el Mac.
# Solo existe si se ha ejecutado scripts/local-https.sh.
location = /ca.crt {
    alias /etc/nginx/certs/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="dbs-ca.crt"';
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri /index.html;
    # La página se revalida siempre: un despliegue nuevo se ve al recargar
    # (y el escáner avisa de que hay versión nueva en sesiones largas).
    add_header Cache-Control "no-cache";
}
