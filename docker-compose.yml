name: dragonball-enhancedapi

x-backend: &backend
  build: ./backend
  image: dragonball-enhancedapi-backend
  env_file: .env
  volumes:
    - ./backend:/app
    - ./data:/data
    # Fotos de los escaneos e imágenes propias de impresiones (MEDIA_ROOT).
    - media:/media
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbs}
      POSTGRES_USER: ${POSTGRES_USER:-dbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/fields/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  celery_worker:
    <<: *backend
    # Concurrencia 1: el sync ya paraleliza las peticiones con hilos (BANDAI_WORKERS).
    # --max-memory-per-child (KB): si tras una tarea el proceso supera ~250 MB, se
    # recicla. Sin esto, tras el sync diario el worker se quedaba con ~470 MB.
    command: celery -A config worker -l info --concurrency 1 --max-memory-per-child 250000
    depends_on:
      backend: { condition: service_healthy }

  # Reconocimiento de cartas (cola «scanner»): una tarea a la vez y con el índice
  # de huellas en memoria, aparte del worker del sync.
  scanner_worker:
    <<: *backend
    command: celery -A config worker -Q scanner -l info --pool=solo -n scanner@%h
    environment:
      SCANNER_WORKER: "1"
    depends_on:
      backend: { condition: service_healthy }

  # Dueño de la webcam del archivador: solo un proceso puede abrir /dev/video0, así
  # que backend (vista previa) y scanner_worker (captura) le piden frames por HTTP.
  # Solo donde hay webcam: COMPOSE_PROFILES=camera en el .env.
  camera:
    profiles: ["camera"]
    build: ./camera
    image: dragonball-enhancedapi-camera
    restart: unless-stopped
    env_file: .env
    environment:
      CAMERA_DEVICE_IN_CONTAINER: ${CAMERA_DEVICE:-/dev/video0}
    # Conexión en caliente: en vez de `devices:` (exige que la webcam exista al
    # crear el contenedor y no ve una reconexión), se monta /dev del host y se
    # permiten todos los dispositivos V4L2 (major 81). Si la webcam se
    # desconecta, el servicio reintenta cada 3 s y se recupera solo.
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"
    group_add:
      - video
    expose:
      - "8080"

  celery_beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
