name: dragonball-enhancedapi

x-backend: &backend
  build: ./backend
  image: dragonball-enhancedapi-backend
  env_file: .env
  volumes:
    - ./backend:/app
    - ./data:/data
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbs}
      POSTGRES_USER: ${POSTGRES_USER:-dbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/fields/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  celery_worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2
    depends_on:
      backend: { condition: service_healthy }

  celery_beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
