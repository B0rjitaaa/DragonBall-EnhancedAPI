# Modo producción (el servidor de casa: nginx + gunicorn). Se activa en el .env del servidor con:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
# Frente al modo desarrollo ahorra ~250 MB de RAM:
# - frontend: build estático servido por Nginx (en vez del servidor de Vite).
# - backend: gunicorn con 1 proceso y 4 hilos (en vez de runserver + autoreload).
# La web se sirve en HTTP_PORT (80) y también en :5173 (enlaces antiguos) y, con
# certificados en ./certs, por HTTPS en HTTPS_PORT (443; scripts/local-https.sh):
# la cámara del móvil lo necesita.

services:
  backend:
    # Copias de seguridad del equipo (solo lectura): /api/health/ lee su último estado y
    # el admin las lista y deja descargarlas.
    # BACKUP_DIR_HOST en el .env del servidor; sin él se monta ./data y no se comprueba nada.
    # Y su carpeta request/ con escritura: «Hacer copia ahora» del admin deja ahí la petición
    # (la recoge dbs-backup-request.path en el servidor; ver scripts/systemd/).
    volumes:
      - ${BACKUP_DIR_HOST:-./data}:/backups:ro
      - ${BACKUP_DIR_HOST:-./data}/request:/backup-request
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1 --threads 4
      --timeout 120
      --access-logfile -
  celery_worker:
    # Lo mismo para los avisos por Telegram (cards.tasks.check_health), que corren aquí.
    volumes:
      - ${BACKUP_DIR_HOST:-./data}:/backups:ro

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # A qué puerto HTTPS manda el escáner si se abre por HTTP (la cámara lo necesita).
        VITE_HTTPS_PORT: ${HTTPS_PORT:-443}
    environment: !reset {}
    volumes: !override
      - media:/srv/media:ro
      - ./certs:/etc/nginx/certs:ro
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "5173:80"
      - "${HTTPS_PORT:-443}:443"
