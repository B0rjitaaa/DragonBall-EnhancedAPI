# CI: tests del backend y compilación del frontend en cada push a develop/main y en cada PR.
# Mismas versiones que en producción (Dockerfiles y docker-compose.yml).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  # Un push nuevo a la misma rama cancela la ejecución anterior.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dbs
          POSTGRES_USER: dbs
          POSTGRES_PASSWORD: dbs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbs -d dbs"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379
      DJANGO_SECRET_KEY: ci-only-not-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Comprobar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (tipos y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos (tsc) y build (vite)
        run: npm run build
